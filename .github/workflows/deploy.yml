name: Deploy Micro Mayhem to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: micro-mayhem-render-lab-final-2026-11
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare reproducible authored miniature models
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build revised Cherry Coupe and model town GLBs for Pages
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'trimesh>=4.4,<5' 'pillow>=10,<13'
          python -m py_compile assets/maple/generate_maple_assets.py
          python assets/maple/generate_maple_assets.py
          python scripts/import_maple_cc0_assets.py
          test -s assets/maple/glb/maple_cherry_coupe.glb
          test -s assets/maple/glb/maple_craftsman_house.glb
          test -s assets/maple/glb/maple_mainstreet_hardware.glb
          test -s assets/maple/glb/maple_scenic_tree.glb

      - name: Validate game source
        run: |
          node --input-type=module --check < maple-junction-world.js
          node --input-type=module --check < maple-junction.js
          node --input-type=module --check < maple-authored-assets.js
          node --input-type=module --check < maple-town-dressing.js
          node --input-type=module --check < maple-imported-assets.js
          node --check tests/maple-junction-smoke.cjs
          node --check game.js
          node --check truck-model.js
          node --check vehicle-preview.js
          node --check quarter-track.js
          node --input-type=module --check < quarter-track.js
          node --check course-presets.js
          node --check course-picker.js
          node --check track-layouts.js
          node --check miniature-world.js
          node --check town-streets.js
          node --input-type=module --check < town-streets.js
          node --input-type=module --check < miniature-world.js
          node --check house-showcase.js
          node --input-type=module --check < house-showcase.js
          node --input-type=module --check < house-render-lab.js
          node --input-type=module --check < house-photo-pass.js
          node --check ho-hero-house.js
          node --input-type=module --check < ho-hero-house.js
          test -s house-showcase.html
          node --check scenery-placement.js
          node --input-type=module --check < scenery-placement.js
          node tests/scenery-placement.test.cjs
          test -s courses.html
          node tests/track-geometry.test.cjs
          test -s quarter-track.html
          test -s vehicle-preview.html
          test -s index.html
          test -s style.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  browser-smoke:
    name: Browser startup regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Smoke-test all courses in Chromium
        run: |
          timeout 120s node tests/browser-smoke.cjs
          timeout 240s node tests/maple-junction-smoke.cjs
      - name: Save HO course previews for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miniature-course-overviews
          path: tests/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  verify-public-gallery:
    name: Verify deployed model gallery and all GLB files
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check out exact published commit
        uses: actions/checkout@v4
      - name: Install real browser test driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Test PUBLIC Pages HTML, 4 GLB downloads, desktop and mobile models
        run: timeout 460s node tests/maple-assets-live-smoke.cjs
      - name: Save live-site desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maple-live-pages-real-browser-proof
          path: tests/screenshots/maple-live-*.png
          if-no-files-found: ignore
          retention-days: 14
