name: Deploy Micro Mayhem to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate game source
        run: |
          node --check game.js
          node --check truck-model.js
          node --check vehicle-preview.js
          node --check quarter-track.js
          node --input-type=module --check < quarter-track.js
          node --check course-presets.js
          node --check course-picker.js
          node --check track-layouts.js
          node --check miniature-world.js
          node --input-type=module --check < miniature-world.js
          test -s courses.html
          node tests/track-geometry.test.cjs
          test -s quarter-track.html
          test -s vehicle-preview.html
          test -s index.html
          test -s style.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  browser-smoke:
    name: Browser startup regression
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Smoke-test all courses in Chromium
        run: timeout 120s node tests/browser-smoke.cjs
