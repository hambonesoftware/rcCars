name: Import and verify CC0 Maple Junction scenery

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import_maple_cc0_assets.py'
      - 'maple-imported-assets.js'
      - 'maple-junction.js'
      - 'maple-junction-world.js'
      - 'tests/maple-junction-smoke.cjs'
      - '.github/workflows/import-maple-assets.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/import_maple_cc0_assets.py'
      - '.github/workflows/import-maple-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-cc0:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
      - name: Install geometry validator
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'trimesh>=4.4,<5' 'pillow>=10,<13'
      - name: Download vetted CC0 assets and validate each GLB
        run: |
          python -m py_compile scripts/import_maple_cc0_assets.py
          python scripts/import_maple_cc0_assets.py
          test -s assets/maple/imported/building-type-a.glb
          test -s assets/maple/imported/b_small.glb
          test -s assets/maple/imported/catalog.json
          test -s assets/maple/imported/rc-truck/vehicle-truck-red.glb
      - name: Verify 10 independent GLBs and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('assets/maple/imported')
          catalog=json.loads((root/'catalog.json').read_text())
          models=catalog['models']
          assert len(models)==13, len(models)
          assert sum(x['file'].endswith('.glb') for x in models.values())==11
          for key,record in models.items():
              assert record['license']=='CC0-1.0', (key,record)
              assert record['source'].startswith('https://github.com/')
              assert (root/record['file']).is_file()
              if record['file'].endswith('.glb'):
                  assert record['triangles']>30
                  assert len(record['bounds'])==2
          print('PASS: 11 authored GLBs, independent Kenney palettes and full source provenance.')
          PY
      - name: Preserve imported GLBs and geometry metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maple-imported-cc0-town-models
          path: assets/maple/imported/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit validated third-party models to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/maple/imported/
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified CC0 3D town models into the repository'
            git push origin HEAD:main
          fi
