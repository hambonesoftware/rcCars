name: Build and validate authored Maple Junction GLB assets

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/maple-generator-part-*.b64'
      - 'assets/maple-junction/gallery.html'
      - 'tests/maple-glb-assets-smoke.cjs'
      - '.github/workflows/maple-assets.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/maple-generator-part-*.b64'
      - '.github/workflows/maple-assets.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install 3D geometry build dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy trimesh==4.11.1 pillow scipy
      - name: Verify compressed source integrity and decode
        run: |
          cat scripts/maple-generator-part-1.b64 scripts/maple-generator-part-2.b64 | base64 -d > /tmp/maple-source.py.gz
          echo 'b273e428b25fb6c62f496f540fa13e2fe0f7afb9ffd75c3d64d8ddcb00c0e3e4  /tmp/maple-source.py.gz' | sha256sum -c -
          gzip -dc /tmp/maple-source.py.gz > scripts/generate_maple_assets.py
          echo '9b20364efa560bfea728209239a8349dcc47b08f7930515feec6c25c03c65849  scripts/generate_maple_assets.py' | sha256sum -c -
          python -m py_compile scripts/generate_maple_assets.py
      - name: Generate actual binary glTF assets
        run: |
          python scripts/generate_maple_assets.py
          mkdir -p assets/maple-junction
          cp scripts/glb/*.glb assets/maple-junction/
      - name: Validate imported geometry, scale, materials and binary magic
        run: |
          python - <<'PY'
          import glob,os,struct,trimesh
          expected={
            'maple_craftsman_house.glb':(50000,15),
            'maple_mainstreet_hardware.glb':(45000,14),
            'maple_cherry_coupe.glb':(9500,10),
            'maple_scenic_tree.glb':(15000,5)
          }
          for f in sorted(glob.glob('assets/maple-junction/*.glb')):
            name=os.path.basename(f)
            with open(f,'rb') as stream:
              assert stream.read(4)==b'glTF',name
              assert struct.unpack('<I',stream.read(4))[0]==2,name
            scene=trimesh.load(f,force='scene')
            tris=sum(len(mesh.faces) for mesh in scene.geometry.values())
            mats=len(scene.geometry)
            assert name in expected,name
            assert tris>expected[name][0] and mats>=expected[name][1],(name,tris,mats)
            assert scene.bounds[0][1]>-0.1,(name,scene.bounds)
            print(f'{name}: {tris} triangles, {mats} materials, {os.stat(f).st_size} bytes')
          assert len(glob.glob('assets/maple-junction/*.glb'))==4
          PY
      - name: Install Chromium test driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Real PlayCanvas desktop and iPhone asset loading tests
        run: timeout 320s node tests/maple-glb-assets-smoke.cjs
      - name: Archive GLB model binaries and real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maple-junction-authored-glb-assets
          path: |
            assets/maple-junction/*.glb
            tests/screenshots/maple-glb-*.png
            scripts/generate_maple_assets.py
          if-no-files-found: ignore
          retention-days: 21
      - name: Commit verified binary models and readable generator to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/maple-junction/*.glb scripts/generate_maple_assets.py
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified Maple Junction authored GLB assets [skip ci]'
            git push origin HEAD:main
          fi
      - name: Redeploy GitHub Pages with verified GLB files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
