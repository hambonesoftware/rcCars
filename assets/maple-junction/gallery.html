<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e4e7dd"><title>Maple Junction · Authored GLB Models</title>
<script type="importmap">{"imports":{"playcanvas":"https://cdn.jsdelivr.net/npm/playcanvas@2.23.3/+esm"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:500 14px system-ui;background:#e0e4dd;color:#264536}
body{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f3e9;padding:12px 17px;border-bottom:1px solid #d1d7cb}
header h1{font-size:13px;line-height:1.2;font-weight:900;margin:0}header small{font-size:10px;color:#65796d}header a{font-weight:850;color:#2d5841;text-decoration:none;font-size:11px}
main{position:relative;flex:1;min-height:0;overflow:hidden}#canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#status{position:absolute;top:12px;left:12px;background:#f7f7eef0;border-radius:10px;padding:11px 14px;max-width:295px;box-shadow:0 7px 22px #243a3127}
#status strong{display:block;font-size:14px}#status small{color:#62806b;display:block;margin-top:5px}#retry-model{display:none;border:0;background:#315e45;color:white;border-radius:8px;margin-top:10px;padding:9px 12px;font-weight:850}body[data-asset-error] #retry-model{display:block}
#help{position:absolute;bottom:14px;right:12px;border-radius:999px;padding:7px 12px;font-size:10px;font-weight:850;background:#f5f4ebe3}
footer{position:relative;z-index:5;display:flex;gap:7px;flex-shrink:0;overflow-x:auto;background:#f5f3e9;padding:9px}
footer button{border:1px solid #a9bcae;background:#fff;border-radius:10px;padding:12px;font:800 12px system-ui;color:#356148;white-space:nowrap}
footer button[aria-pressed=true]{background:#2f6048;color:#fff}
@media(max-width:700px){header{padding:9px}header h1{font-size:11px}header small{font-size:9px}footer{padding:7px}footer button{font-size:11px;padding:10px}#help{font-size:9px}}
</style></head><body><header><div><h1>MAPLE JUNCTION · REAL 3D MESH ASSETS</h1><small>Self-contained glTF 2.0 · PlayCanvas PBR lighting</small></div><a href="../../maple-junction.html">← Racing course</a></header>
<main><canvas id="canvas"></canvas><div id="status" role="status" aria-live="polite"><strong id="model-title">Loading 3D assets…</strong><small id="model-state">Importing model</small><button id="retry-model" type="button">Retry model loading</button></div><div id="help">Drag to orbit · pinch / scroll to zoom</div></main>
<footer><button data-model="house" aria-pressed="true">Craftsman House</button><button data-model="store" aria-pressed="false">Main Street</button><button data-model="car" aria-pressed="false">Cherry Coupe</button><button data-model="tree" aria-pressed="false">Maple Tree</button></footer>
<script type="module">
import * as pc from 'playcanvas';
const canvas=document.querySelector('#canvas'),title=document.querySelector('#model-title'),status=document.querySelector('#model-state');
const models={
 house:{name:'Maple Craftsman House',file:'maple_craftsman_house.glb',focus:5.6,radius:27},
 store:{name:'Maple Hardware Storefront',file:'maple_mainstreet_hardware.glb',focus:6.4,radius:28},
 car:{name:'Maple Cherry Coupe',file:'maple_cherry_coupe.glb',focus:1.0,radius:8.8},
 tree:{name:'Model Railroad Tree',file:'maple_scenic_tree.glb',focus:3.3,radius:14}
};
const device=await pc.createGraphicsDevice(canvas,{deviceTypes:[pc.DEVICETYPE_WEBGL2],antialias:true});
const options=new pc.AppOptions();options.graphicsDevice=device;
options.componentSystems=[pc.RenderComponentSystem,pc.CameraComponentSystem,pc.LightComponentSystem];
options.resourceHandlers=[pc.TextureHandler,pc.ContainerHandler];
const app=new pc.AppBase(canvas);app.init(options);app.setCanvasFillMode(pc.FILLMODE_NONE);app.setCanvasResolution(pc.RESOLUTION_AUTO);
app.graphicsDevice.maxPixelRatio=Math.min(device.maxPixelRatio||1,1.6);
const color=hex=>new pc.Color(parseInt(hex.slice(1,3),16)/255,parseInt(hex.slice(3,5),16)/255,parseInt(hex.slice(5,7),16)/255);
app.scene.ambientLight=color('#68766e');app.scene.exposure=.86;
const cam=new pc.Entity('Asset inspection camera');cam.addComponent('camera',{nearClip:.12,farClip:160,clearColor:color('#c4cec6'),fov:46});cam.camera.toneMapping=pc.TONEMAP_NEUTRAL;app.root.addChild(cam);
const key=new pc.Entity('Warm studio softbox');key.addComponent('light',{type:'directional',color:color('#fff4df'),intensity:1.28,castShadows:true,shadowResolution:1024});key.setEulerAngles(49,-36,0);app.root.addChild(key);
const bounce=new pc.Entity('Cool bounced skylight');bounce.addComponent('light',{type:'directional',color:color('#dae9ef'),intensity:.26});bounce.setEulerAngles(31,131,0);app.root.addChild(bounce);
const cache=new Map();
let selected='house',active=null,yaw=.55,pitch=.29,radius=27,focusY=5.6,pointer=null,pinch=0;
function updateCamera(){
 const d=radius,cos=Math.cos(pitch);
 cam.setLocalPosition(Math.sin(yaw)*cos*d,focusY+Math.sin(pitch)*d,Math.cos(yaw)*cos*d);
 cam.lookAt(0,focusY,0);
}
// GitHub Pages deployments may momentarily serve the gallery before the
// corresponding binary is live at the edge. Try the local file first,
// then the canonical repository raw URL, which supports cross-origin GLB.
const assetPath='../maple/glb/';
const repositoryAssetPath='https://raw.githubusercontent.com/hambonesoftware/rcCars/main/assets/maple/glb/';
const retryButton=document.querySelector('#retry-model');
let loadVersion=0;
const loadErrors=[];
function fetchGLBAsset(url,filename){
  return new Promise((resolve,reject)=>{
    app.assets.loadFromUrlAndFilename(url,filename,'container',(error,asset)=>{
      if(error||!asset?.resource){
        reject(new Error(String(error||'Empty GLB container response')));
      }else resolve(asset);
    });
  });
}
async function choose(type){
  const info=models[type];if(!info)return;
  const version=++loadVersion;
  selected=type;title.textContent=info.name;
  status.textContent='Checking 3D model file…';
  document.body.removeAttribute('data-asset-error');
  document.body.dataset.assetStatus='loading';
  document.body.dataset.assetLoaded='';
  document.querySelectorAll('[data-model]').forEach(button=>
    button.setAttribute('aria-pressed',String(button.dataset.model===type)));
  if(active){active.enabled=false;active=null;}
  radius=info.radius*(window.innerWidth<700?1.43:1);
  focusY=info.focus;updateCamera();
  if(cache.has(type)){
    active=cache.get(type);active.enabled=true;
    status.textContent='3D model loaded · drag to rotate';
    document.body.dataset.assetLoaded=type;
    document.body.dataset.assetStatus='ready';
    return;
  }
  const paths=[
    {kind:'pages',url:new URL(assetPath+info.file,document.baseURI).href},
    {kind:'repository',url:repositoryAssetPath+info.file}
  ];
  const errors=[];
  for(const source of paths){
    if(version!==loadVersion)return;
    document.body.dataset.assetSourceAttempt=source.kind;
    status.textContent=source.kind==='pages'?
      'Loading 3D model from Gallery…':'Trying repository model backup…';
    try{
      const asset=await fetchGLBAsset(source.url,info.file);
      const model=asset.resource.instantiateRenderEntity();
      model.name='Authored '+info.name;
      app.root.addChild(model);
      cache.set(type,model);
      if(version!==loadVersion){model.enabled=false;return;}
      active=model;
      status.textContent='3D model loaded · drag to rotate';
      document.body.dataset.assetLoaded=type;
      document.body.dataset.assetStatus='ready';
      document.body.dataset.assetSource=source.kind;
      document.body.removeAttribute('data-asset-error');
      return;
    }catch(error){
      const message=source.kind+': '+String(error?.message||error);
      errors.push(message);
      loadErrors.push({model:type,message});
      console.warn('Maple Junction GLB model load attempt failed:',message);
    }
  }
  if(version!==loadVersion)return;
  document.body.dataset.assetStatus='error';
  document.body.dataset.assetError=errors.join(' | ').slice(0,350);
  document.body.setAttribute('data-asset-error','true');
  status.textContent='Could not load '+info.name+'. Tap Retry. '+errors.join(' | ').slice(0,155);
}
retryButton.addEventListener('click',()=>choose(selected));
window.addEventListener('error',event=>{
  if(document.body.dataset.assetStatus==='ready')return;
  status.textContent='3D viewer error: '+event.message;
  document.body.dataset.assetStatus='error';
  document.body.dataset.assetError=event.message;
  document.body.setAttribute('data-asset-error','true');
});
window.addEventListener('unhandledrejection',event=>{
  if(document.body.dataset.assetStatus==='ready')return;
  const message=String(event.reason?.message||event.reason);
  status.textContent='3D viewer error: '+message;
  document.body.dataset.assetStatus='error';
  document.body.dataset.assetError=message;
  document.body.setAttribute('data-asset-error','true');
});
canvas.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer.x=e.clientX;pointer.y=e.clientY;yaw+=dx*.007;pitch=Math.max(-.1,Math.min(1.12,pitch+dy*.005));updateCamera();});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>pointer=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(3,Math.min(90,radius*Math.exp(e.deltaY*.0013)));updateCamera();},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length<2)return;const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch){radius=Math.max(3,Math.min(90,radius*pinch/dist));updateCamera();}pinch=dist;},{passive:false});
canvas.addEventListener('touchend',()=>pinch=0);
document.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.model)));
window.addEventListener('resize',()=>{app.resizeCanvas();updateCamera();});updateCamera();app.start();choose('house');
</script></body></html>
